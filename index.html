<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TPR Innov 2026 — Torneio Pessoense de Robótica</title>
<link rel="icon" href="./favicon-tpr.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Press+Start+2P&family=Nunito+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --dark: #3A2B22;
    --cream: #F1EAD9;
    --sage: #A9C168;
    --jungle: #1B6B5C;
    --jungle-deep: #123F38;
    --terracotta: #A83A28;
    --gold: #D9A62E;
    --sand: #C08A54;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    font-family: 'Nunito Sans', sans-serif;
    background: var(--jungle-deep);
    color: var(--cream);
    overflow-x: hidden;
  }

  /* ===== HERO ===== */
  .hero {
    position: relative;
    min-height: 100vh;
    background: linear-gradient(180deg, var(--jungle-deep) 0%, var(--jungle) 35%, #6E5A3C 68%, var(--terracotta) 100%);
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    padding: 90px 24px 200px;
    overflow:hidden;
  }

  /* copa da mata no topo */
  .canopy {
    position:absolute; top:0; left:0; width:100%; height:140px;
    background: var(--jungle-deep);
    -webkit-mask-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 1200 140' preserveAspectRatio='none'><path d='M0,0 H1200 V60 C1150,100 1100,20 1050,70 C1000,110 950,30 900,80 C850,120 800,25 750,75 C700,115 650,20 600,65 C550,110 500,30 450,80 C400,120 350,25 300,70 C250,115 200,25 150,75 C100,115 50,30 0,70 Z'/></svg>");
    mask-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 1200 140' preserveAspectRatio='none'><path d='M0,0 H1200 V60 C1150,100 1100,20 1050,70 C1000,110 950,30 900,80 C850,120 800,25 750,75 C700,115 650,20 600,65 C550,110 500,30 450,80 C400,120 350,25 300,70 C250,115 200,25 150,75 C100,115 50,30 0,70 Z'/></svg>");
    -webkit-mask-size:100% 100%; mask-size:100% 100%;
    z-index:2;
  }

  .menu-btn {
    position:fixed; top:20px; right:20px; z-index:50;
    width:52px; height:52px; border-radius:10px;
    background: var(--dark); border:2px solid var(--gold);
    color:var(--cream); font-size:22px;
    display:flex; align-items:center; justify-content:center;
    cursor:pointer; box-shadow:0 4px 10px rgba(0,0,0,.35);
  }
  .menu-btn:hover { background:#4A382C; }

  .content { position:relative; z-index:5; display:flex; flex-direction:column; align-items:center; max-width:820px; text-align:center; }

  .plate {
    background: var(--cream);
    color: var(--dark);
    padding: 44px 40px 36px;
    clip-path: polygon(2% 6%,10% 0%,22% 4%,34% 0%,46% 5%,58% 0%,70% 4%,82% 0%,92% 6%,100% 3%,98% 96%,88% 100%,76% 96%,64% 100%,52% 95%,40% 100%,28% 96%,16% 100%,4% 95%,0% 97%);
    display:flex; flex-direction:column; align-items:center;
  }
  .plate img.logo { width:min(78vw, 460px); margin-bottom:6px; }

  .pixel-tag {
    font-family:'Press Start 2P', monospace;
    font-size: 11px;
    color: var(--jungle);
    letter-spacing:1px;
    margin: 6px 0 22px;
  }

  .cta-groups { display:flex; gap:22px; flex-wrap:wrap; justify-content:center; width:100%; }
  .cta-group { display:flex; flex-direction:column; gap:10px; flex:1; min-width:220px; }
  .cta-group .eyebrow {
    font-family:'Baloo 2',sans-serif; font-weight:700; font-size:13px;
    letter-spacing:2px; text-transform:uppercase; color: var(--sand);
    margin-bottom:2px;
  }
  .cta {
    font-family:'Baloo 2', sans-serif; font-weight:700; font-size:15px;
    padding: 14px 22px; border-radius: 10px; border:none; cursor:pointer;
    color:var(--cream); text-decoration:none; display:flex; align-items:center; gap:8px; justify-content:center;
    box-shadow: 0 4px 0 rgba(0,0,0,.25);
    transition: background-color .15s;
  }
  .cta.primary.innov { background: var(--jungle); }
  .cta.primary.innov:hover { background:#20806E; }
  .cta.primary.explore { background: var(--terracotta); }
  .cta.primary.explore:hover { background:#C24631; }
  .cta.secondary { background: transparent; color:var(--dark); border:2px solid var(--sand); box-shadow:none; font-size:14px; padding:11px 20px; }
  .cta.secondary:hover { background: rgba(192,138,84,.12); }

  /* ===== FAIXA DE ESCAVAÇÃO (rodapé assinatura) ===== */
  .digsite {
    position:absolute; bottom:0; left:0; width:100%; height:180px;
    background: var(--terracotta);
    z-index:3;
    background-image:
      repeating-linear-gradient(90deg, rgba(0,0,0,.18) 0 2px, transparent 2px 120px),
      repeating-linear-gradient(0deg, rgba(0,0,0,.18) 0 2px, transparent 2px 90px);
  }
  .digsite::before {
    content:''; position:absolute; top:-1px; left:0; width:100%; height:34px;
    background: var(--sand);
    clip-path: polygon(0 100%,0 30%,4% 45%,8% 20%,12% 50%,16% 15%,20% 55%,24% 10%,28% 45%,32% 25%,36% 50%,40% 15%,44% 55%,48% 20%,52% 45%,56% 10%,60% 50%,64% 20%,68% 55%,72% 15%,76% 45%,80% 25%,84% 50%,88% 10%,92% 45%,96% 20%,100% 40%,100% 100%);
  }
  .fossils {
    position:absolute; bottom:14px; left:0; width:100%; z-index:4;
    display:flex; justify-content:space-evenly; align-items:flex-end;
    padding:0 20px;
  }
  .fossils img { height:78px; filter:drop-shadow(0 6px 6px rgba(0,0,0,.3)); }
  .fossils img:nth-child(2) { height:56px; }
  .fossils img:nth-child(4) { height:64px; }

  /* ===== MENU LATERAL ===== */
  .drawer-overlay {
    position:fixed; inset:0; background:rgba(0,0,0,.55); z-index:60;
    opacity:0; pointer-events:none; transition:opacity .25s;
  }
  .drawer-overlay.open { opacity:1; pointer-events:all; }
  .drawer {
    position:fixed; top:0; right:0; height:100%; width:320px; max-width:86vw;
    background: var(--dark); color:var(--cream); z-index:70;
    transform:translateX(100%); transition:transform .3s ease;
    padding: 26px 22px; overflow-y:auto;
    border-left:3px solid var(--gold);
  }
  .drawer.open { transform:translateX(0); }
  .drawer h3 { font-family:'Baloo 2',sans-serif; font-size:13px; letter-spacing:2px; color:var(--gold); margin:22px 0 10px; }
  .drawer h3:first-of-type { margin-top:6px; }
  .drawer a {
    display:flex; align-items:center; gap:10px;
    background: rgba(255,255,255,.06); border:1px solid rgba(255,255,255,.12);
    border-radius:8px; padding:12px 14px; margin-bottom:8px;
    color:var(--cream); text-decoration:none; font-weight:600; font-size:14px;
    transition: background-color .15s;
  }
  .drawer a:hover { background: rgba(255,255,255,.14); }
  .drawer-close { position:absolute; top:18px; right:18px; font-size:22px; cursor:pointer; color:var(--cream); }

  @media (max-width:560px) {
    .plate { padding:30px 20px 26px; }
    .cta { font-size:14px; padding:12px 18px; }
    .fossils img { height:50px; }
    .fossils img:nth-child(2) { height:38px; }
    .fossils img:nth-child(4) { height:42px; }
  }
</style>
</head>
<body>

<div class="menu-btn" onclick="document.getElementById('drawer').classList.add('open');document.getElementById('overlay').classList.add('open')">☰</div>

<div class="hero">
  <div class="canopy"></div>

  <div class="content">
    <div class="plate">
      <img class="logo" src="./LOGO-TPR__1_.png" alt="Torneio Pessoense de Robótica">

      <div class="cta-groups">
        <div class="cta-group">
          <div class="eyebrow">Innov</div>
          <a href="#" class="cta primary innov">📅 Cronograma de Equipes Innov</a>
          <a href="#" class="cta secondary">📺 Placar da Arena Innov</a>
        </div>
        <div class="cta-group">
          <div class="eyebrow">Explore</div>
          <a href="#" class="cta primary explore">📅 Cronograma de Equipes Explore</a>
          <a href="#" class="cta secondary">📺 Placar da Arena Explore</a>
        </div>
      </div>
    </div>
  </div>

  <div class="digsite"></div>
  <div class="fossils">
    <img src="./TPR_cactoo.png" alt="">
    <img src="./TPR_cagado.png" alt="">
    <img src="./TPR_camaleao.png" alt="">
    <img src="./TPR_caranguej.png" alt="">
    <img src="./MASCOTES_sol.png" alt="">
  </div>
</div>

<div class="drawer-overlay" id="overlay" onclick="document.getElementById('drawer').classList.remove('open');this.classList.remove('open')"></div>
<div class="drawer" id="drawer">
  <div class="drawer-close" onclick="document.getElementById('drawer').classList.remove('open');document.getElementById('overlay').classList.remove('open')">✕</div>
  <h3>INNOV</h3>
  <a href="https://tprjp.com.br/innov/">🖥️ Sistema de Avaliação</a>
  <h3>EXPLORE</h3>
  <a href="https://tprjp.com.br/explore/">🖥️ Sistema de Avaliação</a>
</div>

</body>
</html>
